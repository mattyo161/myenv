set-option -g history-limit 100000
set -g mouse on

# Pass through extended key sequences (e.g. Shift+Enter) from the
# outer terminal so apps inside tmux panes (Claude Code, etc.) see them
set -s extended-keys on
set -as terminal-features '*:extkeys'

# Let panes see the real outer terminal (e.g. iTerm.app) instead of tmux
# overriding TERM_PROGRAM, so apps like Claude Code can detect it and
# enable terminal-specific bindings (e.g. Shift+Enter)
set -ga update-environment ' TERM_PROGRAM TERM_PROGRAM_VERSION'
